<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка загрузки файла</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            cursor: pointer;
            display: block;
            z-index: 1;
        }

        /* Скрываем аудио, но оставляем в DOM для воспроизведения */
        #music {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Замени picture.png на своё фото -->
    <img id="bg" src="picture.png" alt="">

    <!-- Аудио: зациклено, играет по клику -->
    <audio id="music" src="music.mp4" loop></audio>

    <script>
        const bg = document.getElementById('bg');
        const music = document.getElementById('music');

        bg.addEventListener('click', () => {
            // Если музыка ещё не играет — запускаем (и с начала, если нужно)
            if (music.paused) {
                music.currentTime = 0;
                music.play();
            } else {
                // Повторный клик — пауза (если хочешь только запуск, удали этот else)
                music.pause();
            }
        });
    </script>
</body>
</html>
